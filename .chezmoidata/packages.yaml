packages:
  brew:
    formula:
      - fzf
      - eza
      - ripgrep
      - git
      - zoxide
      - neovim
      - bash
      - luarocks
      - diff-so-fancy
      - tmux
      - lazygit
      - yazi
      - atuin
    cask:
      - wezterm

  apt:
    packages:
      - fzf
      - eza
      - git
      - ripgrep
      - zsh
      - curl
      - multitail
      - less
      - luarocks
      - zoxide
      - tmux
    ppas:
      - ppa: aos1/diff-so-fancy
        package: diff-so-fancy

  # First-class Linux snap support. Empty today - preserves current
  # behavior exactly while making snap ready to use. Add a tool here,
  # no template edits needed:
  #   - name: spotify
  #     classic: false
  snap: []

  # Flatpak/Flathub applications. Add app_id and human-readable name.
  # Installing via flathub requires flatpak to be installed first.
  flatpak:
    - app_id: org.mozilla.firefox
      name: Firefox
    - app_id: com.discordapp.Discord
      name: Discord 
    - app_id: com.bitwarden.desktop
      name: Bitwarden 
    - app_id: org.localsend.localsend_app
      name: LocalSend 
    - app_id: com.moonlight_stream.Moonlight
      name: Moonlight 
    - app_id: com.usebruno.Bruno
      name: Bruno

  # Generic check/install(/post) abstraction - shared by both OSes for
  # rustup/tree-sitter-cli/TPM/starship today, and the extension point
  # for any future curl|sh-style provider installer:
  #   - name: bun
  #     os: [linux, darwin]
  #     check: 'command -v bun'
  #     install: 'curl -fsSL https://bun.sh/install | bash'
  script_installers:
    - name: claudecode
      os: [linux, darwin]
      computer: [work]
      check: 'test -d $HOME/.local/bin/claude'
      install: 'curl -fsSL https://claude.ai/install.sh | bash'

    - name: opencode
      os: [linux, darwin]
      computer: [personal]
      check: 'test -d "$HOME/.opencode/bin"'
      install: 'curl -fsSL https://opencode.ai/install | bash'
      post_install: 'export PATH="$HOME/.opencode/bin:$PATH"'

    - name: tpm
      os: [linux, darwin]
      check: 'test -d "$HOME/.tmux/plugins/tpm"'
      install: 'git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"'

    - name: rustup
      os: [linux, darwin]
      check: "command -v rustup"
      install: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
        source "$HOME/.cargo/env"
      post_install: '[ -f "$HOME/.cargo/env" ] && source "$HOME/.cargo/env"'

    - name: tree-sitter-cli
      os: [linux, darwin]
      check: "command -v tree-sitter"
      install: "cargo install tree-sitter-cli"

    - name: atuin
      os: [linux]
      check: "command -v atuin"
      install: "curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- --non-interactive"
      post_install: '[ -d "$HOME/.atuin/bin" ] && export PATH="$HOME/.atuin/bin:$PATH"'

    - name: starship
      os: [linux, darwin]
      check: 'test -f "$HOME/.config/starship.toml"'
      install: "curl -sS https://starship.rs/install.sh | sh"
      post_install: 'starship preset nerd-font-symbols -o "$HOME/.config/starship.toml"'
